name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build diagnostic executable (console enabled)
        run: pyinstaller --noconfirm --console --name HuanjingWallpaperGallery-Diagnostic --distpath dist/diagnostic --workpath build/diagnostic --collect-all PySide6 main.py
      - name: Build normal executable (windowed)
        run: pyinstaller --noconfirm --windowed --name HuanjingWallpaperGallery --distpath dist/standard --workpath build/standard --collect-all PySide6 main.py
      - name: Upload EXE packages
        uses: actions/upload-artifact@v4
        with:
          name: HuanjingWallpaperGallery-Windows-Diagnostic
          path: |
            dist/diagnostic/HuanjingWallpaperGallery-Diagnostic/
            dist/standard/HuanjingWallpaperGallery/
          if-no-files-found: error
