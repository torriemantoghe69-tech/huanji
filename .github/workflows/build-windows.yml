name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Check Python syntax
        run: python -m py_compile main.py
      - name: Build windowed executable
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --runtime-hook build_hooks/popup_guard.py
          --name HuanjingWallpaperGallery
          --exclude-module PySide6.Qt3DCore
          --exclude-module PySide6.Qt3DRender
          --exclude-module PySide6.Qt3DInput
          --exclude-module PySide6.QtCharts
          --exclude-module PySide6.QtDataVisualization
          --exclude-module PySide6.QtGraphs
          --exclude-module PySide6.QtMultimedia
          --exclude-module PySide6.QtMultimediaWidgets
          --exclude-module PySide6.QtNetworkAuth
          --exclude-module PySide6.QtPdf
          --exclude-module PySide6.QtPdfWidgets
          --exclude-module PySide6.QtQuick
          --exclude-module PySide6.QtQuickWidgets
          --exclude-module PySide6.QtQml
          --exclude-module PySide6.QtRemoteObjects
          --exclude-module PySide6.QtScxml
          --exclude-module PySide6.QtSensors
          --exclude-module PySide6.QtSerialPort
          --exclude-module PySide6.QtSpatialAudio
          --exclude-module PySide6.QtTest
          --exclude-module PySide6.QtWebChannel
          --exclude-module PySide6.QtWebEngineCore
          --exclude-module PySide6.QtWebEngineWidgets
          --exclude-module PySide6.QtWebEngineQuick
          main.py
      - name: Add diagnostic launcher
        shell: pwsh
        run: |
          @'
          @echo off
          cd /d "%~dp0"
          HuanjingWallpaperGallery.exe
          set APP_EXIT=%errorlevel%
          if not "%APP_EXIT%"=="0" (
            echo.
            echo The application exited with code %APP_EXIT%.
            echo Check %%LOCALAPPDATA%%\HuanjingWallpaperGallery\crash.log
            pause
          )
          '@ | Set-Content -Encoding ASCII dist\启动诊断.bat
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: HuanjingWallpaperGallery-Windows
          path: |
            dist/HuanjingWallpaperGallery.exe
            dist/启动诊断.bat
          if-no-files-found: error
