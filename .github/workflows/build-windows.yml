name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build single diagnostic executable
        run: pyinstaller --noconfirm --onefile --console --name HuanjingWallpaperGallery-Diagnostic --collect-all PySide6 main.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: HuanjingWallpaperGallery-Windows
          path: dist/HuanjingWallpaperGallery-Diagnostic.exe
          if-no-files-found: error
